name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_desktop:
        description: 'Build desktop installer and release (Windows)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write  # Needed for creating releases

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # 1. Detect changed paths (push only)
  detect-changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend: frontend/**
            backend: backend/**

  # 2. Build frontend for web deployment
  build-frontend:
    needs: detect-changes
    if: |
      always() &&
      !cancelled() &&
      !failure() &&
      (github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cd frontend && npm ci && npm run build:web

      # Ephemeral artifact — used by XergiZ product-update.yml for immediate deploy
      - uses: actions/upload-artifact@v4
        with:
          name: texthunter-dist
          path: frontend/dist/

      # Persistent release asset — survives beyond 90-day artifact retention
      - name: Package web dist for persistent release
        run: |
          cd frontend
          tar -czf texthunter-web-dist.tar.gz -C dist .

      - name: Upload to persistent latest-web release
        run: |
          gh release upload latest-web frontend/texthunter-web-dist.tar.gz --clobber 2>/dev/null || \
          gh release create latest-web frontend/texthunter-web-dist.tar.gz \
            --title "Latest Web Build" \
            --notes "Auto-generated web build for XergiZ integration. Do not delete." \
            --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2.1 Notify xergiz frontend
  notify-xergiz-frontend:
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Send dispatch to XergiZ frontend
        uses: peter-evans/repository-dispatch@v3
        continue-on-error: true
        with:
          token: ${{ secrets.XERGIZ_TRIGGER_TOKEN }}
          repository: XergiZ/xergiz
          event-type: product-updated
          client-payload: |
            {
              "product": "text-hunter",
              "product_id": "texthunter",
              "run_id": "${{ github.run_id }}",
              "repo": "${{ github.repository }}"
            }

  # 2.2 Notify xergiz backend
  notify-xergiz-backend:
    needs: detect-changes
    if: |
      always() &&
      !cancelled() &&
      !failure() &&
      (github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.backend == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Send dispatch to XergiZ backend
        uses: peter-evans/repository-dispatch@v3
        continue-on-error: true
        with:
          token: ${{ secrets.XERGIZ_TRIGGER_TOKEN }}
          repository: XergiZ/xergiz
          event-type: product-backend-updated
          client-payload: |
            {
              "product": "text-hunter",
              "product_id": "texthunter",
              "run_id": "${{ github.run_id }}",
              "repo": "${{ github.repository }}"
            }

  # 3. Build desktop app (Windows)
  build-desktop:
    if: github.event_name == 'push' || github.event.inputs.build_desktop != false
    runs-on: windows-2025
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: cd backend && uv sync --frozen

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Get version from package.json
        id: get-version
        run: |
          $version = (Get-Content package.json | Select-String '"version": "(.*?)"').Matches.Groups[1].Value
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build desktop app
        run: npm run build:desktop

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: nsis-installer
          path: release/TextHunter-*-setup.exe

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: portable-exe
          path: release/TextHunter-*-Portable.exe

      - name: Upload latest.yml
        uses: actions/upload-artifact@v4
        with:
          name: latest-yml
          path: release/latest.yml

  # 4. Create GitHub Release with desktop assets (ALWAYS runs)
  create-release:
    needs: build-desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download NSIS installer
        uses: actions/download-artifact@v4
        with:
          name: nsis-installer
          path: ./artifacts/

      - name: Download portable EXE
        uses: actions/download-artifact@v4
        with:
          name: portable-exe
          path: ./artifacts/

      - name: Download latest.yml
        uses: actions/download-artifact@v4
        with:
          name: latest-yml
          path: ./artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-desktop.outputs.version }}
          name: TextHunter v${{ needs.build-desktop.outputs.version }}
          files: artifacts/*
          body_path: CHANGELOG.md
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
